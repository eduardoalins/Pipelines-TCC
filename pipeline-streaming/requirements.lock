# Travamento completo do ambiente Python do Flink — decisao E7 aplicada as
# dependencias transitivas.
#
# O requirements.txt fixa so o apache-flink==1.20.5. As dependencias DELE —
# numpy, pandas, pyarrow, apache-beam — aceitam FAIXAS de versao, e o pip escolhe
# a mais recente de cada faixa no momento do build. Sem este arquivo, reconstruir
# a imagem daqui a um mes poderia trazer versoes diferentes, sem aviso: a mesma
# deriva que se pegou com o PyYAML do lado do Spark (DecisaoEtapa4 secao 5.2).
#
# Origem: `pip3 freeze` dentro da imagem tcc-flink:1.20.5, construida em
# 21/09/2026, depois de o check_chain_flink.py verificar a cadeia inteira. E o
# ambiente que PRODUZIU aquela verificacao, e nao um que se pretendia ter.
#
# Usado pelo Dockerfile como arquivo de RESTRICAO (pip install -c): o
# requirements.txt diz O QUE instalar, este arquivo diz EM QUAL versao.
#
# Nota: setuptools nao aparece aqui porque vem do apt (python3-setuptools do
# Ubuntu 22.04, versao 59.x), nao do pip. E dele que vem o aviso de
# pkg_resources depreciado que o apache-beam emite; como o apt do jammy nao o
# atualiza para a 81 — onde a API foi removida —, o aviso fica inofensivo.
#
# Para regenerar depois de mudar o requirements.txt:
#     docker compose build flink
#     docker run --rm tcc-flink:1.20.5 pip3 freeze
